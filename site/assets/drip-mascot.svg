<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" role="img" aria-labelledby="t">
  <title id="t">Drip, the Drip Dash mascot</title>
  <defs>
    <radialGradient id="body" cx="38%" cy="55%" r="70%">
      <stop offset="0" stop-color="#9FE3F0"/>
      <stop offset="0.45" stop-color="#2F8FD0"/>
      <stop offset="1" stop-color="#005695"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="100" cy="238" rx="54" ry="8" fill="#003a66" opacity=".18"/>
  <!-- feet -->
  <ellipse cx="74" cy="226" rx="18" ry="9" fill="#00477c"/>
  <ellipse cx="128" cy="226" rx="18" ry="9" fill="#00477c"/>
  <!-- body -->
  <path d="M100 18 C 96 40 30 100 30 152 A70 70 0 0 0 170 152 C 170 100 104 40 100 18 Z"
        fill="url(#body)" stroke="#003a66" stroke-width="5" stroke-linejoin="round"/>
  <!-- wave cowlick (echoes the logo wave) -->
  <path d="M100 18 C 112 4 132 8 128 22 C 124 32 112 28 116 20" fill="none" stroke="#003a66" stroke-width="5" stroke-linecap="round"/>
  <!-- shine -->
  <path d="M62 112 C 66 90 82 70 92 60" fill="none" stroke="url(#shine)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="58" cy="130" r="6" fill="#fff" opacity=".85"/>
  <!-- eyes -->
  <ellipse cx="82" cy="150" rx="15" ry="19" fill="#fff" stroke="#003a66" stroke-width="3"/>
  <ellipse cx="122" cy="150" rx="15" ry="19" fill="#fff" stroke="#003a66" stroke-width="3"/>
  <circle cx="87" cy="154" r="8" fill="#040707"/>
  <circle cx="127" cy="154" r="8" fill="#040707"/>
  <circle cx="90" cy="150" r="3" fill="#fff"/>
  <circle cx="130" cy="150" r="3" fill="#fff"/>
  <!-- eyebrows: determined -->
  <path d="M68 126 L 92 132" stroke="#003a66" stroke-width="4" stroke-linecap="round"/>
  <path d="M136 126 L 112 132" stroke="#003a66" stroke-width="4" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="66" cy="178" rx="9" ry="5" fill="#ff8fa3" opacity=".7"/>
  <ellipse cx="140" cy="178" rx="9" ry="5" fill="#ff8fa3" opacity=".7"/>
  <!-- grin -->
  <path d="M86 182 Q 104 200 120 182" fill="#003a66" stroke="#003a66" stroke-width="4" stroke-linejoin="round"/>
  <path d="M95 190 Q 104 196 112 190" fill="#ff8fa3"/>
</svg>
