<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Drip Dash has moved</title>
<link rel="canonical" href="https://drip-dash-nine.vercel.app/">
<script>
  // Drip Dash moved to Vercel. Send every old GitHub Pages link to its new home,
  // keeping ?query and #hash (newsletter links put the player's details there).
  (function () {
    var NEW = 'https://drip-dash-nine.vercel.app';
    var KNOWN = ['/', '/leaderboard.html', '/rules.html'];   // Drip Run is the only game: every other old page goes home
    var p = location.pathname.replace(/^\/drip-dash/, '').replace(/index\.html$/, '');
    if (p && p.charAt(p.length - 1) !== '/' && p.indexOf('.') < 0) p += '/';
    if (!p) p = '/';
    var target = KNOWN.indexOf(p) >= 0 ? p : '/';         // the home page, old game pages and anything unknown -> Drip Run
    location.replace(NEW + target + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://drip-dash-nine.vercel.app/">
<style>body{font-family:system-ui,sans-serif;background:#04263f;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{color:#5fd4ff}</style>
</head>
<body>
<p>Drip Dash has moved.<br><a href="https://drip-dash-nine.vercel.app/">Play at drip-dash-nine.vercel.app</a></p>
</body>
</html>
