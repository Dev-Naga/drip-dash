name: Supabase keep-alive

# Free Supabase projects pause after ~7 days without activity.
# This reads the public leaderboard once a day so the database stays awake.
# It does nothing until SUPABASE_URL / SUPABASE_KEY are filled in site/js/config.js.

on:
  schedule:
    - cron: '17 13 * * *'   # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping leaderboard
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']*" site/js/config.js || true)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']*" site/js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured yet - skipping."; exit 0; fi
          AUTH=(); if [[ "$KEY" == eyJ* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          curl -sf -X POST "$URL/rest/v1/rpc/get_leaderboard" \
            -H "apikey: $KEY" "${AUTH[@]}" -H "Content-Type: application/json" \
            -d '{"p_period":"month","p_limit":1}' > /dev/null
          echo "Supabase is awake."
