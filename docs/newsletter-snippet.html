<!--
  Drip Dash newsletter block (email-safe: tables + inline styles).
  1) Replace https://YOUR-GAME-URL/ with the live game URL (2 places).
  2) Upload marketing/newsletter-hero-600x315.jpg to HubSpot Files and replace the img src (or host it with the game at /assets/og-card.jpg).
  3) Update the month in utm_campaign each issue.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td style="padding:0;">
      <a href="https://YOUR-GAME-URL/?email={{ contact.email }}&name={{ contact.firstname }}&company={{ contact.company }}&utm_source=hubspot&utm_medium=email&utm_campaign=newsletter-2026-11" target="_blank">
        <img src="https://YOUR-GAME-URL/assets/og-card.jpg" width="600" alt="Play Drip Dash by inCon-trol Water Systems" style="display:block;width:100%;max-width:600px;height:auto;border:0;border-radius:12px;">
      </a>
    </td>
  </tr>
  <tr>
    <td style="padding:18px 8px 6px;text-align:center;color:#040707;font-size:16px;line-height:24px;">
      <strong style="color:#005695;font-size:22px;">New: Drip Dash 🏁</strong><br>
      Help Drip race through irrigation fields, pump stations and fountain plazas.<br>
      Highest score this month wins bragging rights in our next issue.
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:10px 0 24px;">
      <a href="https://YOUR-GAME-URL/?email={{ contact.email }}&name={{ contact.firstname }}&company={{ contact.company }}&utm_source=hubspot&utm_medium=email&utm_campaign=newsletter-2026-11" target="_blank"
         style="background:#005695;color:#ffffff;text-decoration:none;font-weight:bold;font-size:18px;padding:14px 36px;border-radius:10px;display:inline-block;">▶ Play now</a>
    </td>
  </tr>
</table>
